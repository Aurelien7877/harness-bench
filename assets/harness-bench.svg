<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
<title id="title">Harness Bench</title>
<desc id="desc">Pi and OpenCode receive the same task, input files and Ollama model. A shared grader checks their outputs and records scores and runtime.</desc>
<rect width="800" height="580" rx="18" fill="#101b29"/>
<rect x="1" y="1" width="798" height="578" rx="17" fill="none" stroke="#32485c"/>
<g font-family="Menlo,Consolas,monospace">
<text x="48" y="60" fill="#f5f9fc" font-size="34" font-weight="bold">HARNESS BENCH</text>
<text x="48" y="91" fill="#a9c0d1" font-size="17">Compare agents with one local model</text>
<g font-size="19" xml:space="preserve"><text x="100" y="142" fill="#72efd0">       +---------------------------------+</text>
<text x="100" y="164" fill="#72efd0">       |  SAME TASK + FILES + OLLAMA      |</text>
<text x="100" y="186" fill="#72efd0">       +----------------+----------------+</text>
<text x="100" y="208" fill="#8babc4">                        |</text>
<text x="100" y="230" fill="#8babc4">             +----------+----------+</text>
<text x="100" y="252" fill="#8babc4">             |                     |</text>
<text x="100" y="274" fill="#ffbc94">     +-------+-------+     +-------+-------+</text>
<text x="100" y="296" fill="#ffbc94">     |      Pi       |     |   OpenCode    |</text>
<text x="100" y="318" fill="#ffbc94">     +-------+-------+     +-------+-------+</text>
<text x="100" y="340" fill="#8babc4">             |                     |</text>
<text x="100" y="362" fill="#e5eef6">         output A              output B</text>
<text x="100" y="384" fill="#8babc4">             |                     |</text>
<text x="100" y="406" fill="#8babc4">             +----------+----------+</text>
<text x="100" y="428" fill="#8babc4">                        |</text>
<text x="100" y="450" fill="#8babc4">              +---------+---------+</text>
<text x="100" y="472" fill="#e5eef6">              |    SAME GRADER    |</text>
<text x="100" y="494" fill="#8babc4">              +---------+---------+</text>
<text x="100" y="516" fill="#8babc4">                        |</text>
<text x="100" y="538" fill="#e5eef6">                scores + runtime</text></g>
</g></svg>
